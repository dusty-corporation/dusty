name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.8.18
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Network isolation
        run: uv run python tools/check_no_network.py
      - name: Model host exclusion
        run: uv run python tools/check_no_huggingface.py
      - name: License allowlist
        run: uv run python tools/check_licenses.py
