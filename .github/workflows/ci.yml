name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.8.18
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/downloads
            build/bin
            build/models
          key: ${{ runner.os }}-m2-assets-${{ hashFiles('native/versions.toml') }}
      - name: Fetch verified development assets
        run: uv run python tools/fetch_dev_binaries.py
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests and strict-package coverage
        run: uv run python tools/measure_coverage.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: CI-only downloader public release integration
        run: uv run pytest -q -m real_network tests/integration/test_downloader_network.py
        env:
          DUSTY_CI_REAL_NETWORK: '1'
      - name: Network isolation
        run: uv run python tools/check_no_network.py
      - name: Model host exclusion
        run: uv run python tools/check_no_huggingface.py
      - name: License allowlist
        run: uv run python tools/check_licenses.py

  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.8.18
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/downloads
            build/bin
            build/models
          key: ${{ runner.os }}-m2-assets-${{ hashFiles('native/versions.toml') }}
      - name: Fetch verified development assets
        run: uv run python tools/fetch_dev_binaries.py
      - name: Validate WFP event parser
        run: ./tests/offline/test_wfp_events.ps1
      - name: Firewall and WFP offline acceptance
        run: ./tools/test_network_isolation.ps1
      - name: Model Manager GUI and allowed downloader WFP audit
        run: ./tools/test_model_download_isolation.ps1
      - name: Preserve redacted Model Manager audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m4-download-audit
          path: |
            build/model-download-*/summary.json
            build/model-download-*/download-result.json
          if-no-files-found: warn

  packaging-spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.8.18
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/downloads
            build/bin
            build/models
          key: ${{ runner.os }}-m2-assets-${{ hashFiles('native/versions.toml') }}
      - name: Fetch pinned engine-v2 inputs
        run: uv run python tools/fetch_dev_binaries.py
      - name: Build shared onedir bundle
        run: |
          uv run python tools/build_bundle.py 2>&1 | Tee-Object -FilePath build/packaging-build.log
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
      - name: Enforce Qt exclusions and executable layout
        run: uv run python tools/check_bundle.py dist/Dusty
      - name: Inventory bundle and generate draft notices and SBOM
        run: uv run python -m tools.inventory_bundle dist/Dusty
      - name: Validate WFP event parser
        run: ./tests/offline/test_wfp_events.ps1
      - name: Packaged Tiny download and calibrated WFP self-test
        run: ./tools/test_network_isolation.ps1 -Bundle dist/Dusty
      - name: Audit every bundled file against the license allowlist
        run: |
          uv run python tools/check_licenses.py --bundle dist/Dusty --inventory build/packaging/audit/inventory.json 2>&1 | Tee-Object -FilePath build/packaging/audit/license-findings.txt
          if ($LASTEXITCODE -ne 0) { throw 'Bundle contains unresolved or unapproved licenses; see audit evidence' }
      - name: Preserve audit evidence only, never unapproved binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaging-spike-audit
          path: |
            build/packaging/audit
            build/packaging-build.log
            build/pyinstaller/dusty/warn-dusty.txt
            build/offline-*/summary.json
          if-no-files-found: error
