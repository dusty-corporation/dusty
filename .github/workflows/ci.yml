name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.8.18
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/downloads
            build/bin
            build/models
          key: ${{ runner.os }}-m2-assets-${{ hashFiles('native/versions.toml') }}
      - name: Fetch verified development assets
        run: uv run python tools/fetch_dev_binaries.py
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests and strict-package coverage
        run: uv run python tools/measure_coverage.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: CI-only downloader public release integration
        run: uv run pytest -q -m real_network tests/integration/test_downloader_network.py
        env:
          DUSTY_CI_REAL_NETWORK: '1'
      - name: Network isolation
        run: uv run python tools/check_no_network.py
      - name: Model host exclusion
        run: uv run python tools/check_no_huggingface.py
      - name: License allowlist
        run: uv run python tools/check_licenses.py

  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.8.18
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/downloads
            build/bin
            build/models
          key: ${{ runner.os }}-m2-assets-${{ hashFiles('native/versions.toml') }}
      - name: Fetch verified development assets
        run: uv run python tools/fetch_dev_binaries.py
      - name: Validate WFP event parser
        run: ./tests/offline/test_wfp_events.ps1
      - name: Firewall and WFP offline acceptance
        run: ./tools/test_network_isolation.ps1
