[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dusty"
version = "0.0.1"
description = "Offline Windows transcription application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "PySide6==6.9.2",
  "python-docx==1.2.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-qt==4.5.0",
  "ruff==0.13.1",
  "mypy==1.18.2",
  "pyinstaller==6.16.0",
  "cyclonedx-bom==7.1.0",
  "pip-licenses==5.0.0",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"
cache_dir = ".pytest_cache"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tools"]
check_untyped_defs = true
